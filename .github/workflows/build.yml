name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Restore locked dependencies
        run: dotnet restore --locked-mode
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Unit tests
        env:
          SSH_HARDENER_TEST_PYTHON: python
        run: dotnet test tests/SSHHardener.Tests/SSHHardener.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=unit.trx"
      - name: Verify live WPF log updates without connecting
        timeout-minutes: 2
        run: dotnet run --project tests/SSHHardener.UiTests/SSHHardener.UiTests.csproj -c Release --no-build --no-restore -- artifacts/ui-regression.txt
      - name: Publish unsigned portable build
        run: dotnet publish src/SSHHardener.App/SSHHardener.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -p:RestoreLockedMode=true -o artifacts/publish
      - name: Verify WPF startup without showing a window or connecting
        shell: pwsh
        timeout-minutes: 2
        run: |
          $diagnosticsPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/startup-check.txt'
          $executablePath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/publish/SSHHardener.App.exe'
          $startupProcess = Start-Process -FilePath $executablePath -ArgumentList @('--self-test', ('"{0}"' -f $diagnosticsPath)) -Wait -PassThru -WindowStyle Hidden
          if (-not (Test-Path -LiteralPath $diagnosticsPath)) {
            throw 'The WPF startup test produced no diagnostics file.'
          }
          $diagnostics = Get-Content -LiteralPath $diagnosticsPath -Raw
          Write-Output $diagnostics
          if ($startupProcess.ExitCode -ne 0 -or -not $diagnostics.StartsWith('PASS:')) {
            throw "WPF startup test failed with exit code $($startupProcess.ExitCode)."
          }
      - name: Build per-user installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/SSHHardener.iss'
      - name: Upload unsigned review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SSHHardener-unsigned-win-x64
          path: |
            artifacts/publish/**
            artifacts/installer/**
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
      - name: Upload WPF startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpf-startup-diagnostics
          path: |
            artifacts/startup-check.txt
            artifacts/ui-regression.txt
          if-no-files-found: ignore
